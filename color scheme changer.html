<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Scheme Switcher</title>
  <style>
    /* Initial color scheme */
    body {
      background-color: #f0f0f0; /* Gray background */
      color: #333; /* Dark text color */
      font-family: Arial, sans-serif;
      padding: 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Styles for color options */
    #pinkButton { background-color: #ff69b4; /* Pink */ }
    #coralButton { background-color: #ff7f50; /* Coral */ }
    #tealButton { background-color: #008080; /* Teal */ }
    #redButton { background-color: #ff0000; /* Red */ }
    #blackButton { background-color: #000000; /* Black */ }

    /* Other styles */
    #switcher {
      list-style-type: none;
      padding: 0;
    }

    #switcher li {
      display: inline-block;
      width: 50px;
      height: 50px;
      cursor: pointer;
      margin: 5px;
      border: 2px solid #ffffff;
      outline: 2px solid #333333;
      border-radius: 8px;
      transition: transform 0.2s ease;
    }

    #switcher li:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <ul id="switcher">
    <li id="pinkButton"></li>
    <li id="coralButton"></li>
    <li id="tealButton"></li>
    <li id="redButton"></li>
    <li id="blackButton"></li>
  </ul>

  <h1>Color Scheme Switcher</h1>
  <p>Try clicking on one of the colors above to change the colors on this page!</p>

  <script>
    // JavaScript for color scheme switcher
    const pinkButton = document.getElementById('pinkButton');
    const coralButton = document.getElementById('coralButton');
    const tealButton = document.getElementById('tealButton');
    const redButton = document.getElementById('redButton');
    const blackButton = document.getElementById('blackButton');

    pinkButton.addEventListener('click', () => {
      document.body.style.backgroundColor = '#ff69b4';
      document.body.style.color = '#333';
    });

    coralButton.addEventListener('click', () => {
      document.body.style.backgroundColor = '#ff7f50';
      document.body.style.color = '#333';
    });

    tealButton.addEventListener('click', () => {
      document.body.style.backgroundColor = '#008080';
      document.body.style.color = '#fff';
    });

    redButton.addEventListener('click', () => {
      document.body.style.backgroundColor = '#ff0000';
      document.body.style.color = '#fff';
    });

    blackButton.addEventListener('click', () => {
      document.body.style.backgroundColor = '#000000';
      document.body.style.color = '#fff';
    });
  </script>

</body>
</html>
